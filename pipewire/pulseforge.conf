# PulseForge — PipeWire Audio Configuration
#
# Installs to: ~/.config/pipewire/filter-chain.conf.d/pulseforge.conf
# Run: pipewire -c filter-chain.conf  (separate process from main pipewire daemon)
#
# Creates:
#   - Mic processing filter-chain: Gate → EQ → RNNoise → Compressor
#     Output: pulseforge.mic.processed (Audio/Source)
#
# IMPORTANT: Calf LV2 control ports use LINEAR amplitude (0.0-1.0), NOT dB!
#   To convert: linear = 10^(dB/20)
#   -50dB → 0.003162, -20dB → 0.1, -6dB → 0.5, 0dB → 1.0

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "PulseForge Mic Processed"
            media.name       = "PulseForge Mic"
            media.role       = "Communication"

            filter.graph = {
                nodes = [
                    # 1. Gate (pre) — Calf Gate LV2
                    #    Bypass: 0=active, 1=bypassed
                    #    Threshold: linear (0.000977..1.0), -50dB=0.003162
                    {
                        type   = lv2
                        name   = gate
                        plugin = "http://calf.sourceforge.net/plugins/Gate"
                        control = {
                            "bypass"            0
                            "threshold"        0.003162
                            "ratio"             2.0
                            "attack"             0.001
                            "release"            0.05
                            "makeup"             1.0
                            "knee"               2.5
                            "detection"          0
                            "stereo_link"        1.0
                            "range"              0.061250
                        }
                    }

                    # 2. Parametric EQ — Calf Equalizer8Band LV2
                    #    Bypass: 0=active, 1=bypassed
                    {
                        type   = lv2
                        name   = eq
                        plugin = "http://calf.sourceforge.net/plugins/Equalizer8Band"
                        control = {
                            "bypass"         0
                            "level_in"       1.0
                            "level_out"      1.0
                            "hp_active"      1
                            "hp_freq"        35.0
                            "hp_mode"          0
                            "hp_q"            0.7
                            "lp_active"      0
                            "lp_freq"      20000.0
                            "lp_mode"          0
                            "lp_q"            0.7
                            "ls_active"      0
                            "ls_level"        0.0
                            "ls_freq"        100.0
                            "ls_q"            0.7
                            "hs_active"      0
                            "hs_level"        0.0
                            "hs_freq"      10000.0
                            "hs_q"            0.7
                            "p1_active"       1
                            "p1_level"        1.0
                            "p1_freq"        100.0
                            "p1_q"             1.0
                            "p2_active"       1
                            "p2_level"        1.0
                            "p2_freq"        300.0
                            "p2_q"             1.0
                            "p3_active"       1
                            "p3_level"        1.0
                            "p3_freq"       1000.0
                            "p3_q"             1.0
                            "p4_active"       1
                            "p4_level"        1.0
                            "p4_freq"       3000.0
                            "p4_q"             1.0
                            "zoom"            0.5
                        }
                    }

                    # 3. AI Noise Cancellation — RNNoise LADSPA
                    #    No bypass port — set VAD Threshold to 0 to effectively disable
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" 50.0
                        }
                    }

                    # 4. Compressor — Calf Compressor LV2
                    #    Bypass: 0=active, 1=bypassed
                    #    Threshold: linear (0.000977..1.0), -20dB=0.1
                    {
                        type   = lv2
                        name   = compressor
                        plugin = "http://calf.sourceforge.net/plugins/Compressor"
                        control = {
                            "bypass"       0
                            "level_in"     1.0
                            "threshold"  0.100000
                            "ratio"        3.0
                            "attack"       0.003
                            "release"      0.250
                            "makeup"       1.0
                            "knee"         2.5
                            "detection"    0
                            "stereo_link"  1.0
                            "mix"          1.0
                        }
                    }
                ]

                # Audio port connections between nodes
                # Calf LV2 audio ports: in_l, in_r, out_l, out_r
                # RNNoise LADSPA audio ports: Input (L), Input (R), Output (L), Output (R)
                links = [
                    { output = "gate:out_l"          input = "eq:in_l" }
                    { output = "gate:out_r"          input = "eq:in_r" }
                    { output = "eq:out_l"            input = "rnnoise:Input (L)" }
                    { output = "eq:out_r"            input = "rnnoise:Input (R)" }
                    { output = "rnnoise:Output (L)"  input = "compressor:in_l" }
                    { output = "rnnoise:Output (R)"  input = "compressor:in_r" }
                ]
            }

            audio.position = [ FL FR ]

            capture.props = {
                node.name = "pulseforge.mic.capture"
            }

            playback.props = {
                node.name        = "pulseforge.mic.processed"
                media.class      = "Audio/Source"
                node.description = "PulseForge Processed Mic"
            }
        }
    }
]