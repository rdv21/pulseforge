[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseforge"
version = "1.2.0"
description = "Virtual audio mixer with DSP mic processing for PipeWire"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aielia"}]
keywords = ["audio", "mixer", "pipewire", "dsp", "noise-suppression", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

dependencies = [
    "PySide6>=6.6",
    "numpy>=2.0",
    "Pillow>=10.0",
]

[project.scripts]
pulseforge = "pulseforge.main:main"

[project.gui-scripts]
pulseforge-gui = "pulseforge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulseforge*"]

[tool.setuptools.package-data]
"pulseforge.qml" = ["*.qml", "*.png"]
"pulseforge.qml.components" = ["*.qml"]
"pulseforge" = ["Icon.png"]
